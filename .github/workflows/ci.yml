name: CI

# Proves the claim in the README rather than asserting it. A reviewer should be
# able to see that the build, the types and the lint all pass without installing
# anything, and without trusting a screenshot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: build, types, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build FIRST, then types.
      #
      # Next 16 generates `PageProps` and `LayoutProps` into .next/types, and
      # writes next-env.d.ts to reference them. Both are gitignored - correctly,
      # they are build output - so on a fresh checkout they do not exist yet and
      # `tsc` reports `Cannot find name 'PageProps'` on six files. The first run
      # of this workflow failed in 30 seconds for exactly that reason.
      #
      # The build generates them, so the type check has something to resolve. This
      # is also the honest order: you cannot typecheck a codebase whose types the
      # framework has not generated yet.
      - name: Build
        run: npm run build

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint --max-warnings=0 --quiet

      #
      # Start, poll and assert in one step on purpose: a background process does
      # not survive to the next step, and `npx wait-on` would mean installing a
      # package over the network to test a server that is already running.
      - name: Boots and serves the landing page
        run: |
          npm run start &
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null -w "GET /          -> %{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "GET /sign-in   -> %{http_code}\n" http://localhost:3000/sign-in

          # The security property, stated so it holds either way.
          #
          # CI has no credentials, so the preview route answers 503 (not
          # configured) where a configured server answers 401 (not signed in).
          # What must never happen is a 200: that would mean an anonymous caller
          # received a compiled project. Asserting the specific code would make
          # this test break every time the route was corrected.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:3000/api/projects/00000000-0000-0000-0000-000000000000/preview)
          echo "GET /preview (anon) -> $code"
          test "$code" != "200"

